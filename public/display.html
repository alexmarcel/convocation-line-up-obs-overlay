<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Graduation Display</title><link rel="stylesheet" href="/styles.css"></head>
<body class="role-page"><header id="roleHeader" class="role-header"><h1 id="roleTitle">Graduation Display</h1><div><span class="status"><span class="dot" id="stateDot"></span><span id="stateText">Connecting</span></span><div class="sync-message" id="syncMessage"></div></div></header><div id="audioControls" class="audio-controls" hidden><span id="audioStatus">Audio not enabled</span><button id="enableAudio" type="button">Enable audio</button></div>
<main id="scannerView" class="scanner-main" hidden><div id="scannerSearch" class="scanner-search"><input id="scanInput" class="scan-input" autocomplete="off" placeholder="Scan an ID or search by name" role="combobox" aria-autocomplete="list" aria-controls="scannerResults" aria-expanded="false"><div id="scannerResults" class="scanner-results" role="listbox" hidden></div></div><div class="student-confirm panel"><img id="confirmPhoto" class="photo-unavailable" alt="" aria-hidden="true"><div><h2 id="confirmName">Ready to scan</h2><div id="confirmDetails" class="scanner-student-details"><span id="confirmProgram">The scanner stays focused automatically.</span><span id="confirmMarks"></span></div><div id="ack" class="ack"></div></div></div><div id="scannerAudioTimeline" class="audio-timeline" hidden><div class="audio-timeline-track"><span data-audio-timeline-fill></span></div><div data-audio-timeline-label>0:00 / 0:00</div></div></main>
<main id="stageView" class="stage" hidden><section id="stageCard" class="stage-card"><img id="studentPhoto" class="photo-unavailable" alt="" aria-hidden="true"><div class="stage-details"><h2 id="studentName"></h2><div id="studentGroup" class="group"></div><div id="studentMarks" class="marks"></div></div></section></main>
<div class="offline-banner">Network offline — using the last synchronized library</div>
<script src="/client-crypto.js"></script><script src="/output-settings.js"></script><script src="/audio-fade.js"></script><script src="/audio-timeline.js"></script><script src="/cache-policy.js"></script><script src="/cache.js"></script><script src="/socket.js"></script><script src="/photo-loader.js"></script><script src="/scanner-search.js"></script><script src="/display.js"></script></body></html>
